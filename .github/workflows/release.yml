name: Release

# Two ways to cut a release (both need the version in pyproject.toml bumped on main first):
#   1. Actions -> Release -> "Run workflow", enter the tag (for example v0.3.2).
#   2. Push a tag: git tag v0.3.2 && git push origin v0.3.2
# The workflow builds the Python packages and the macOS app, creates the GitHub
# release as a draft, attaches every file, publishes it, and uploads
# voxcpm2-api and voxcpm2-compat to PyPI through trusted publishing.
#
# Do not publish the GitHub release by hand: this repository uses immutable
# releases, so files can no longer be attached once a release is published.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.3.2 (must match the version in pyproject.toml)"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  python-artifacts:
    name: Build Python artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check that the tag matches the package versions
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          for file in pyproject.toml packages/voxcpm2-compat/pyproject.toml; do
            actual="$(python -c "import sys, tomllib; print(tomllib.load(open(sys.argv[1], 'rb'))['project']['version'])" "$file")"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$file::version is $actual, but the release tag is $RELEASE_TAG"
              exit 1
            fi
          done

      - name: Build API distributions
        run: python -m build

      - name: Build compat distributions
        run: python -m build packages/voxcpm2-compat --outdir dist

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload API build outputs
        uses: actions/upload-artifact@v7
        with:
          name: api-dist
          path: |
            dist/voxcpm2_api-*
            dist/voxcpm2-api-*

      - name: Upload compat build outputs
        uses: actions/upload-artifact@v7
        with:
          name: compat-dist
          path: |
            dist/voxcpm2_compat-*
            dist/voxcpm2-compat-*

  tauri-macos:
    name: Build Tauri macOS artifact
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./voxcpm2-ui/src-tauri -> target"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2.0"

      - name: Build embedded macOS API bundle
        run: ./scripts/build-macos-embedded-api.sh

      - name: Install Rust target info
        run: rustc -vV

      - name: Build Tauri app bundle
        working-directory: voxcpm2-ui/src-tauri
        run: cargo tauri build --bundles app

      - name: Archive macOS app artifacts
        run: |
          mkdir -p release-assets/tauri
          VERSION_TAG="${RELEASE_TAG}"
          ARCH="$(uname -m)"
          ditto -c -k --sequesterRsrc --keepParent \
            "voxcpm2-ui/src-tauri/target/release/bundle/macos/VoxCPM2.app" \
            "release-assets/tauri/VoxCPM2-ui-macos-${VERSION_TAG}-${ARCH}.zip"
          ./scripts/build-macos-dmg.sh \
            "voxcpm2-ui/src-tauri/target/release/bundle/macos/VoxCPM2.app" \
            "release-assets/tauri/VoxCPM2-ui-macos-${VERSION_TAG}-${ARCH}.dmg" \
            "VoxCPM2"
          tar -czf \
            "release-assets/tauri/voxcpm2_api_macos-${VERSION_TAG}-${ARCH}.tar.gz" \
            -C "voxcpm2-ui/src-tauri/resources/api-macos" \
            voxcpm2-api

      - name: Upload Tauri build output
        uses: actions/upload-artifact@v7
        with:
          name: tauri-dist
          path: release-assets/tauri/*

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - python-artifacts
      - tauri-macos
    permissions:
      contents: write
    steps:
      - name: Download API artifacts
        uses: actions/download-artifact@v8
        with:
          name: api-dist
          path: dist

      - name: Download compat artifacts
        uses: actions/download-artifact@v8
        with:
          name: compat-dist
          path: dist

      - name: Download Tauri artifact
        uses: actions/download-artifact@v8
        with:
          name: tauri-dist
          path: dist

      # Releases are immutable once published, so the files are attached to a
      # draft first and the draft is published afterwards.
      - name: Create, fill and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > is_draft.txt 2>/dev/null; then
            if [ "$(cat is_draft.txt)" = "false" ]; then
              echo "::warning::Release $RELEASE_TAG was already published by hand, so no files can be attached (immutable releases). The files are available as artifacts of this workflow run."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --generate-notes --title "$RELEASE_TAG" --target "$TARGET_SHA"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest

  pypi-api:
    name: Publish voxcpm2-api to PyPI
    runs-on: ubuntu-latest
    needs:
      - python-artifacts
    environment:
      name: pypi
      url: https://pypi.org/project/voxcpm2-api/
    permissions:
      id-token: write
    steps:
      - name: Download API artifacts
        uses: actions/download-artifact@v8
        with:
          name: api-dist
          path: dist

      # Trusted publishing (OIDC): no API token is stored in this repository.
      # Attestations are generated automatically.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true

  pypi-compat:
    name: Publish voxcpm2-compat to PyPI
    runs-on: ubuntu-latest
    needs:
      - python-artifacts
    environment:
      name: pypi
      url: https://pypi.org/project/voxcpm2-compat/
    permissions:
      id-token: write
    steps:
      - name: Download compat artifacts
        uses: actions/download-artifact@v8
        with:
          name: compat-dist
          path: dist

      # Trusted publishing (OIDC): no API token is stored in this repository.
      # Attestations are generated automatically.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
