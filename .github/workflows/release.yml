name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  python-artifacts:
    name: Build Python artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build API distributions
        run: python -m build

      - name: Build compat distributions
        run: python -m build packages/voxcpm2-compat --outdir dist

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload Python build outputs
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  tauri-macos:
    name: Build Tauri macOS artifact
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./voxcpm2-ui/src-tauri -> target"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2.0"

      - name: Build embedded macOS API bundle
        run: ./scripts/build-macos-embedded-api.sh

      - name: Install Rust target info
        run: rustc -vV

      - name: Build Tauri app bundle
        working-directory: voxcpm2-ui/src-tauri
        run: cargo tauri build --bundles app

      - name: Archive macOS app artifacts
        run: |
          mkdir -p release-assets/tauri
          VERSION_TAG="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"
          ditto -c -k --sequesterRsrc --keepParent \
            "voxcpm2-ui/src-tauri/target/release/bundle/macos/VoxCPM2.app" \
            "release-assets/tauri/VoxCPM2-ui-macos-${VERSION_TAG}-${ARCH}.zip"
          ./scripts/build-macos-dmg.sh \
            "voxcpm2-ui/src-tauri/target/release/bundle/macos/VoxCPM2.app" \
            "release-assets/tauri/VoxCPM2-ui-macos-${VERSION_TAG}-${ARCH}.dmg" \
            "VoxCPM2"
          tar -czf \
            "release-assets/tauri/voxcpm2_api_macos-${VERSION_TAG}-${ARCH}.tar.gz" \
            -C "voxcpm2-ui/src-tauri/resources/api-macos" \
            voxcpm2-api

      - name: Upload Tauri build output
        uses: actions/upload-artifact@v4
        with:
          name: tauri-dist
          path: release-assets/tauri/*

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - python-artifacts
      - tauri-macos
    permissions:
      contents: write
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Download Tauri artifact
        uses: actions/download-artifact@v4
        with:
          name: tauri-dist
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
